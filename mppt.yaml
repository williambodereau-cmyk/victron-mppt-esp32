esphome:
  name: victron-mppt

esp32:
  board: esp32dev
  framework:
    type: arduino

external_components:
  - source: github://Fabian-Schmidt/esphome-victron_ble

logger:
  level: INFO

ota:
  - platform: esphome
    password: "choisis-un-mot-de-passe-ota"

wifi:
  networks:
    - ssid: "Cudy"
      password: "45244773"
  ap:
    ssid: "Victron-MPPT Fallback"
    password: "fallback1234"

mqtt:
  broker: 192.168.10.225
  port: 1883
  discovery: false

esp32_ble_tracker:

victron_ble:
  - id: mppt1
    mac_address: "FD:9A:09:60:17:C0"
    bindkey: "3550b4cf81e740e13b708e916545d4da"
  - id: mppt2
    mac_address: "F5:6D:71:09:B0:9F"
    bindkey: "d3b2f6d7fff9dd462cdae6042c953fb0"
  - id: mppt3
    mac_address: "C8:DE:05:F3:97:D4"
    bindkey: "e336ba3cd4d4055bfea85696cb055ceb"

globals:
  - id: mppt1_v
    type: float
    initial_value: '0'
  - id: mppt1_i
    type: float
    initial_value: '0'
  - id: mppt1_pv
    type: float
    initial_value: '0'
  - id: mppt2_v
    type: float
    initial_value: '0'
  - id: mppt2_i
    type: float
    initial_value: '0'
  - id: mppt2_pv
    type: float
    initial_value: '0'
  - id: mppt3_v
    type: float
    initial_value: '0'
  - id: mppt3_i
    type: float
    initial_value: '0'
  - id: mppt3_pv
    type: float
    initial_value: '0'

sensor:
  # MPPT 1
  - platform: victron_ble
    victron_ble_id: mppt1
    name: "MPPT1 Battery Voltage"
    type: BATTERY_VOLTAGE
    on_value:
      then:
        - globals.set: {id: mppt1_v, value: !lambda 'return x;'}
  - platform: victron_ble
    victron_ble_id: mppt1
    name: "MPPT1 Battery Current"
    type: BATTERY_CURRENT
    on_value:
      then:
        - globals.set: {id: mppt1_i, value: !lambda 'return x;'}
  - platform: victron_ble
    victron_ble_id: mppt1
    name: "MPPT1 PV Power"
    type: PV_POWER
    on_value:
      then:
        - globals.set: {id: mppt1_pv, value: !lambda 'return x;'}
  - platform: victron_ble
    victron_ble_id: mppt1
    name: "MPPT1 Yield Today"
    type: YIELD_TODAY

  # MPPT 2
  - platform: victron_ble
    victron_ble_id: mppt2
    name: "MPPT2 Battery Voltage"
    type: BATTERY_VOLTAGE
    on_value:
      then:
        - globals.set: {id: mppt2_v, value: !lambda 'return x;'}
  - platform: victron_ble
    victron_ble_id: mppt2
    name: "MPPT2 Battery Current"
    type: BATTERY_CURRENT
    on_value:
      then:
        - globals.set: {id: mppt2_i, value: !lambda 'return x;'}
  - platform: victron_ble
    victron_ble_id: mppt2
    name: "MPPT2 PV Power"
    type: PV_POWER
    on_value:
      then:
        - globals.set: {id: mppt2_pv, value: !lambda 'return x;'}
  - platform: victron_ble
    victron_ble_id: mppt2
    name: "MPPT2 Yield Today"
    type: YIELD_TODAY

  # MPPT 3
  - platform: victron_ble
    victron_ble_id: mppt3
    name: "MPPT3 Battery Voltage"
    type: BATTERY_VOLTAGE
    on_value:
      then:
        - globals.set: {id: mppt3_v, value: !lambda 'return x;'}
  - platform: victron_ble
    victron_ble_id: mppt3
    name: "MPPT3 Battery Current"
    type: BATTERY_CURRENT
    on_value:
      then:
        - globals.set: {id: mppt3_i, value: !lambda 'return x;'}
  - platform: victron_ble
    victron_ble_id: mppt3
    name: "MPPT3 PV Power"
    type: PV_POWER
    on_value:
      then:
        - globals.set: {id: mppt3_pv, value: !lambda 'return x;'}
  - platform: victron_ble
    victron_ble_id: mppt3
    name: "MPPT3 Yield Today"
    type: YIELD_TODAY

interval:
  - interval: 10s
    then:
      - mqtt.publish:
          topic: mppt1/solarcharger
          payload: !lambda |-
            char buf[200];
            snprintf(buf, sizeof(buf), "{\"Pv\":{\"V\":%.2f},\"Yield\":{\"Power\":%.1f},\"Dc\":{\"0\":{\"Voltage\":%.2f,\"Current\":%.2f}}}",
              id(mppt1_v), id(mppt1_pv), id(mppt1_v), id(mppt1_i));
            return std::string(buf);
      - mqtt.publish:
          topic: mppt2/solarcharger
          payload: !lambda |-
            char buf[200];
            snprintf(buf, sizeof(buf), "{\"Pv\":{\"V\":%.2f},\"Yield\":{\"Power\":%.1f},\"Dc\":{\"0\":{\"Voltage\":%.2f,\"Current\":%.2f}}}",
              id(mppt2_v), id(mppt2_pv), id(mppt2_v), id(mppt2_i));
            return std::string(buf);
      - mqtt.publish:
          topic: mppt3/solarcharger
          payload: !lambda |-
            char buf[200];
            snprintf(buf, sizeof(buf), "{\"Pv\":{\"V\":%.2f},\"Yield\":{\"Power\":%.1f},\"Dc\":{\"0\":{\"Voltage\":%.2f,\"Current\":%.2f}}}",
              id(mppt3_v), id(mppt3_pv), id(mppt3_v), id(mppt3_i));
            return std::string(buf);
